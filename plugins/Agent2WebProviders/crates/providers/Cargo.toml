[package]
name = "agent2api-web-providers"
description = "Agent2API 网页提供商插件"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[[bin]]
name = "agent2api-web-providers"
path = "src/main.rs"

[features]
default = ["all"]
all = ["chatglm", "deepseek"]
chatglm = []
deepseek = []

[dependencies]
# SDK 与协议库随仓库一起管理（plugins/Agent2Providers），不再按 git tag 拉取：
# 改协议时本地立刻生效，离线也能编译。
agent2api-provider-protocol = { path = "../../../Agent2Providers/crates/provider-protocol" }
agent2api-provider-sdk = { path = "../../../Agent2Providers/crates/provider-sdk" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "multipart"] }
url = "2"
base64 = "0.22"
md-5 = "0.10"
getrandom = "0.2"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
rusqlite = { version = "0.40", features = ["bundled"] }
windows = { version = "0.61", features = ["Win32_Security_Cryptography"] }
